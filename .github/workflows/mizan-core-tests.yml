name: MIZAN CORE software tests

on:
  push:
    branches: [main, mizan-core-recovery-2026-10-27]
  pull_request:
    branches: [main]

jobs:
  python-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile recovered sources
        run: python -m py_compile archive/recovered/mizan_core_v04.py archive/recovered/mizan_core_v0_2.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
